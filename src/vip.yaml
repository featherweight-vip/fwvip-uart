# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# The VIP's sources. Two exports, as every fwvip-<proto>:
#   xtor-pkg       fwvip_uart_xtor_pkg: the oversampling factor and status
#                  bits the VIP's items, agents and sequences share
#   vip-uvm-hvlsrc fwvip_uart_pkg: the UVM agents, items and sequences
# The VIP builds no transactors, bridges or checkers: those are the kit's
# (fw.proto.uart.*), and a bench brings the ones it uses.
fragment:
  tasks:
  - export: xtor-pkg
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: uvm
      incdirs: ["."]
      include: [fwvip_uart_xtor_pkg.sv]

  # The UVM layer. Needs the kit's class layer (the role APIs and bridges,
  # which reference the transactor interfaces) and fwvip-core's clock
  # provider (the tx agent counts idle time and frame ends on it).
  # Only the package unit is listed; its .svh files come in via the incdir.
  - export: vip-uvm-hvlsrc
    uses: std.FileSet
    needs:
    - xtor-pkg
    - fw.proto.uart.class
    - org.fwvip.core.core-uvm-pkg
    with:
      type: systemVerilogSource
      base: uvm
      incdirs: ["."]
      include: [fwvip_uart_pkg.sv]
